<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bienvenue</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin:0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #00ff88, #0f0f0f);
    color:#fff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }

  .box {
    background:#151515;
    padding:50px 30px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:420px;
    box-shadow:0 0 40px rgba(0,255,136,0.9);
    animation: zoom 1s ease;
    position: relative;
    overflow: hidden;
  }

  @keyframes zoom {
    from { transform:scale(0.3); opacity:0; }
    to { transform:scale(1); opacity:1; }
  }

  h1 {
    font-size:2.2em;
    color:#00ff88;
    margin-bottom:15px;
    animation: glow 1.5s infinite alternate;
  }

  @keyframes glow {
    from { text-shadow:0 0 10px #00ff88; }
    to { text-shadow:0 0 25px #00ff88; }
  }

  p {
    color:#ccc;
    margin-bottom:30px;
    font-size:1.1em;
    line-height:1.5;
  }

  .motivation-text {
    font-size:1.3em;
    color:#00ff88;
    font-weight:bold;
    margin:30px 0;
    padding:20px;
    background:rgba(0,255,136,0.1);
    border-radius:15px;
    border-left:4px solid #00ff88;
    animation: slideIn 1s ease-out;
    position: relative;
    overflow: hidden;
  }

  .motivation-text:before {
    content:"✨";
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    animation: sparkle 2s infinite;
  }

  .motivation-text:after {
    content:"✨";
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    animation: sparkle 2s infinite 0.5s;
  }

  @keyframes sparkle {
    0%, 100% { opacity:0.3; transform:translateY(-50%) scale(0.8); }
    50% { opacity:1; transform:translateY(-50%) scale(1.2); }
  }

  @keyframes slideIn {
    from { transform:translateY(20px); opacity:0; }
    to { transform:translateY(0); opacity:1; }
  }

  .loading-bar {
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.1);
    border-radius:3px;
    margin:40px 0 20px;
    overflow:hidden;
  }

  .loading-progress {
    width:0%;
    height:100%;
    background:linear-gradient(90deg, #00ff88, #00cc66);
    border-radius:3px;
    animation: loading 7s linear forwards;
  }

  @keyframes loading {
    0% { width:0%; }
    100% { width:100%; }
  }

  .status-message {
    color:#aaa;
    font-size:0.9em;
    margin-top:15px;
    font-style:italic;
    animation: fadeIn 2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity:0; }
    to { opacity:1; }
  }

  .icon-container {
    display:flex;
    justify-content:center;
    gap:20px;
    margin:25px 0;
  }

  .icon {
    font-size:2em;
    animation: float 3s infinite ease-in-out;
  }

  .icon:nth-child(1) { animation-delay:0s; color:#00ff88; }
  .icon:nth-child(2) { animation-delay:0.5s; color:#00cc66; }
  .icon:nth-child(3) { animation-delay:1s; color:#00aa44; }

  @keyframes float {
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-10px); }
  }

  .confetti {
    position:absolute;
    width:10px;
    height:10px;
    background:#00ff88;
    opacity:0;
    animation: confettiFall 5s linear infinite;
  }

  @keyframes confettiFall {
    0% {
      transform:translateY(-100px) rotate(0deg);
      opacity:1;
    }
    100% {
      transform:translateY(500px) rotate(360deg);
      opacity:0;
    }
  }
  /* ICON STYLING */
    .icon {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: var(--green);
    }
  /* Police Google Montserrat */
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');

/* Header général */
.lux-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:90px;
  display:flex;
  justify-content:center;
  align-items:center;
  backdrop-filter: blur(6px);
  background: rgba(0,0,0,0.03);
  z-index:99999;
}

/* Conteneur logo + texte */
.brand-container{
  display:flex;
  align-items:center;
  gap:20px; /* espace logo-texte */
  animation: fadeSlideIn 1s ease-out; /* animation à l'apparition */
}

/* Icône logo rond */
.brand-icon{
  width:64px;
  height:64px;
  border-radius:50%;
  background: rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow: 
    0 0 25px rgba(0,0,0,0.6),
    inset 0 0 10px rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
}

/* Image logo à l'intérieur */
.brand-img{
  width:75%;
  height:75%;
  object-fit:cover;
  border-radius:50%;
  filter: 
    grayscale(100%)
    contrast(1.2)
    brightness(1.1);
  transition: transform 0.3s ease;
}

.brand-img:hover{
  transform: scale(1.1);
}

/* Import de polices premium - Version améliorée */
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Playfair+Display:wght@700&family=Montserrat:wght@300;400&display=swap');

/* Conteneur pour alignement logo + texte */
.brand-container {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Texte marque premium - Version élégance sobre */
.brand-text {
  font-family: 'Cinzel', serif; /* Police serif élégante pour le luxe */
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 4px; /* Espacement premium */
  color: #f5f5f5; /* Blanc cassé luxueux */
  text-transform: uppercase;
  
  /* Effets textuels subtils */
  background: linear-gradient(135deg, #f5f5f5 0%, #d4af37 50%, #f5f5f5 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  
  /* Ombre élégante */
  text-shadow: 
    1px 1px 2px rgba(0, 0, 0, 0.3),
    0 0 20px rgba(212, 175, 55, 0.1);
  
  position: relative;
  padding-bottom: 4px;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Ligne de soulignement élégante */
.brand-text::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 10%;
  width: 80%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #d4af37, transparent);
  transform: scaleX(0.8);
  transition: transform 0.5s ease;
}

/* Hover premium - effet discret et élégant */
.brand-text:hover {
  transform: translateY(-1px);
  letter-spacing: 4.5px; /* Léger agrandissement de l'espacement */
  
  background: linear-gradient(135deg, #ffffff 0%, #d4af37 45%, #ffffff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  
  text-shadow: 
    2px 2px 4px rgba(0, 0, 0, 0.2),
    0 0 30px rgba(212, 175, 55, 0.15);
}

.brand-text:hover::after {
  transform: scaleX(1);
  background: linear-gradient(90deg, transparent, #ffd700, #d4af37, #ffd700, transparent);
}

/* Variante avec or métallique */
.brand-text.gold {
  background: linear-gradient(135deg, 
    #f5f5f5 0%, 
    #d4af37 25%, 
    #ffd700 50%, 
    #d4af37 75%, 
    #f5f5f5 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Version minimaliste premium */
.brand-text.minimal {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  letter-spacing: 3px;
  color: #e6e6e6;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  background: none;
  -webkit-text-fill-color: #e6e6e6;
}

/* Petite description sous le nom de marque (optionnel) */
.brand-tagline {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 8px;
  color: #b3b3b3;
  text-transform: uppercase;
  margin-top: -5px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="box" id="mainBox">
  <h1>🎉 Bienvenue !</h1>
  <p>
    Bien joué frérot 💚<br>
    T'es maintenant à l'intérieur.<br>
    L'aventure commence...
  </p>

  <div class="icon-container">
    <div class="icon">🚀</div>
    <div class="icon">💎</div>
    <div class="icon">🔥</div>
  </div>

  <div class="motivation-text">
    Prépare-toi à découvrir quelque chose d'incroyable !
  </div>

  <div class="loading-bar">
    <div class="loading-progress"></div>
  </div>

  <div class="status-message">
    Préparation de ton expérience unique...
  </div>
</div>

<script>
  // Création de confettis
  function createConfetti() {
    const box = document.getElementById('mainBox');
    for(let i = 0; i < 15; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.animationDelay = Math.random() * 5 + 's';
      confetti.style.background = i % 3 === 0 ? '#00ff88' : i % 3 === 1 ? '#00cc66' : '#ffffff';
      box.appendChild(confetti);
    }
  }

  // Messages motivants pendant le chargement
  const messages = [
    "Préparation de ton expérience unique...",
    "Chargement des fonctionnalités exclusives...",
    "Presque prêt, accroche-toi ! 💚",
    "C'est le moment, tu vas kiffer !"
  ];

  let messageIndex = 0;
  const statusElement = document.querySelector('.status-message');
  
  function changeMessage() {
    messageIndex = (messageIndex + 1) % messages.length;
    statusElement.style.opacity = 0;
    
    setTimeout(() => {
      statusElement.textContent = messages[messageIndex];
      statusElement.style.opacity = 1;
    }, 500);
  }

  // Démarrer les animations
  createConfetti();
  
  // Changer le message toutes les 2.5 secondes
  const messageInterval = setInterval(changeMessage, 2500);
  
  // Redirection après 7 secondes
  setTimeout(() => {
    clearInterval(messageInterval);
    window.location.href = 'index.html';
  }, 7000);
</script>

</body>
</html>
